# The compiled candidate's own origin.
#
# A preview is a complete Next application, and a complete application owns an
# origin. So this vhost answers every preview label, and the application reads
# which build a request belongs to from the Host: a preview's own links, its own
# chunks and its own /api calls are all just paths on the origin that served the
# page. Nothing is mounted and nothing is rewritten.
#
# A label is minted per build, so the name has to be a pattern rather than a
# list. It is a single label under the apex because the zone's certificate is a
# one-level wildcard: `*.helloada.app` covers `p-….helloada.app` and nothing
# deeper. That is a certificate fact, so one record and one vhost serve every
# preview that can ever exist, and no build waits for DNS or a certificate.
#
# The pattern names the platform's own prefix, so it never answers for a host
# this platform did not mint and cannot shadow another service on the zone.
server {
    listen 80;
    listen [::]:80;
    server_name "~^p-[a-f0-9]{8}-[a-z0-9][a-z0-9-]{0,61}[a-z0-9]-[a-f0-9]{10}\.helloada\.app$";

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name "~^p-[a-f0-9]{8}-[a-z0-9][a-z0-9-]{0,61}[a-z0-9]-[a-f0-9]{10}\.helloada\.app$";

    # The public certificate is Cloudflare's universal one, which already covers
    # a single label under the apex; the owner's browser never sees this origin
    # certificate. It is kept so the vhost loads as one block with the rest of
    # the zone, and replacing it with an Origin CA wildcard is a host step that
    # changes nothing here.
    ssl_certificate /etc/letsencrypt/live/preview.helloada.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preview.helloada.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # A preview serves a compiled site, not uploads; the workspace bridge owns
    # media. Keep the ceiling small enough that a stray body cannot be used to
    # hold a connection open.
    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:3014;
        proxy_http_version 1.1;
        # The Host is the preview's identity: the application resolves the
        # tenant and the exact build from it, so it must arrive unchanged.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # A candidate streams RSC payloads and assets; buffering them adds a
        # copy and delays the first byte the owner sees.
        proxy_buffering off;
    }
}
