# Shared Ada API ingress. DNS for api.helloada.app points at this host.
server {
    listen 80;
    listen [::]:80;
    server_name api.helloada.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.helloada.app;

    ssl_certificate /etc/letsencrypt/live/api.helloada.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.helloada.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The shared API's owner upload bridge accepts media up to 25 MB, so this
    # ingress must carry that body. Nginx's 1 MB default answered every real
    # clip with an HTML 413 before the API saw it, and the owner's gallery read
    # that as a connection failure. Keep this at or above the API's own media
    # ceiling: tests/test_media_upload_limit.py fails if the two disagree.
    client_max_body_size 32m;

    location /v1/ {
        proxy_pass http://127.0.0.1:3014;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # An upload is a body in flight: stream it to the API instead of
        # buffering a copy to disk first. Responses are already unbuffered.
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
