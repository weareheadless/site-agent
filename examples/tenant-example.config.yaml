instance_name: tenant-example
data_dir: /srv/site-agent/configs/tenant-example/data

# Host-owned GitHub/Cloudflare wiring is inherited from the canonical profile
# configured by the host; do not copy secrets or duplicate the mapping here.

activation:
  enabled: false

site:
  adapter: payload_gateway
  repository: your-org/your-site-repository
  branch: main
  preview_branch: preview
  clone_path: /srv/site-agent/sites/tenant-example
  preview_url: https://preview.example.test
  writable_patterns:
    - src/app/(frontend)/**
    - src/components/**
    - src/app/(payload)/custom.scss
    - src/styles/**
    - public/**
  payload:
    enabled: true
    url: https://tenant.example.test
    api_prefix: /api/workspace
    token_env: PROVISIONED_TENANT_EXAMPLE_TOKEN
    contract:
      # The gateway client is schema-neutral; each tenant declares the fields
      # its Payload instance permits for draft reads and writes.
      collections:
        pages: [sourceId, slug, title, sourceUrl, pageKind, metaDescription, canonicalUrl, content, sections, openGraph, seo, gallery]
        products: [sourceId, slug, title, sourceUrl, description, content, sections, price, currency, availability, gallery, category]
        posts: [sourceId, slug, title, sourceUrl, excerpt, content, sections, publishedAt, modifiedAt, author, featuredImage, gallery]
      globals:
        navigation: [items, groups, footer, footerGroups]
        siteSettings: [siteName, businessName, description, websiteUrl, tagline, contactLabel, telephone, email, facebookUrl, instagramUrl, promoText, promoHref, promoCta, footerKicker, footerTitle, footerNote, logo, address]
      media_fields: [alt, description, tags, analysisStatus, analysisProvider, analysisModel, analysisVersion, analysisError, analysisUpdatedAt, dominantColors, suggestedUses, qualityNotes, ocrText, proposedKnowledge, sourceKind, analysis]

env:
  payload_gateway_token: PROVISIONED_TENANT_EXAMPLE_TOKEN
  vision_api_key: SITE_AGENT_LLM_API_KEY

persona:
  name: Ada
  voice: "Warm, clear, restrained French. Prefer concrete craft language over marketing slogans."
  audience: "Visitors discovering the tenant site and professional creative partners."
  directions:
    - "Write in French unless the owner asks for another language."
    - "Treat the profile below as observed migration evidence until the owner confirms it."

customer_profile:
  status: bootstrap_needs_owner_review
  source: checked_in_migration_snapshot
  owner_review_required: true
  business:
    name: Example Tenant
    observed_description: "Artisanat d'art autour de la couleur, de la restauration et de la création d'objets qui ont une âme."
    observed_site_settings:
      business_name: "Example Tenant"
      public_description: "Découvrez un univers de créations artisanales : tapisserie de siège, restauration de luminaires, coussins déco... Chaque pièce est unique, faite main avec passion pour un intérieur joyeux et coloré."
      website_url: https://tenant.example.test
      locality: Saint-Pierre-en-Port
      postal_code: "76540"
      telephone: "0659015744"
    observed_offerings:
      - "Abat-jours artisanaux"
      - "Appliques murales"
      - "Lampes à poser, suspensions et lampes baladeuses"
      - "Créations et projets d'upcycling"
      - "Projets professionnels et collaborations créatives"
  brand:
    observed_language: fr-FR
    observed_values:
      - "Créativité responsable"
      - "Pièces uniques et savoir-faire artisanal"
  unknowns:
    - "Nom légal, localisation et coordonnées à afficher"
    - "Services actuels, prix, délais, stock et modalités de commande"
    - "Audience prioritaire et objectif de conversion de la nouvelle page"
    - "Claims, partenaires, certifications et liens validés par la propriétaire"

intake:
  enabled: true
  database_only: true
  research:
    enabled: true
    max_sources_per_pass: 8
    max_items_per_source: 15
    max_passes_before_owner_turn: 1

# Reader-led article research is the default pipeline. The primary research
# locale drives the article language and market; article_research does not have
# to restate them.
seo:
  research:
    languages:
      - code: fr
        markets: [FR]
        primary: true
    existing_locales: [fr]
  article_research:
    enabled: true
    timezone: Europe/Paris

# The intake contract is JSON and DeepSeek may spend part of its completion
# budget on reasoning. Keep enough room for the closing delimiters; a truncated
# response must otherwise fall back to a generic question.
design_engine:
  enabled: true
  build_profile: next_react
  production_candidate: true
  orchestration: creative
  provider: openrouter
  push_mode: isolated_remote_ref
  quality:
    browser: true
    accessibility: true
    visual_critic: false
    native_source_required: false
    originality_required: true
  intake_advisor:
    timeout_seconds: 90
    max_retries: 1
    max_tokens: 4096

builder:
  enabled: true
  timeout_seconds: 1800
  provider_timeout_seconds: 2100
  provider_chunk_timeout_seconds: 180
  output_tokens: 8192
  reasoning_effort: low

vision:
  enabled: true
  base_url: https://openrouter.ai/api/v1
  model: google/gemini-2.5-flash
  timeout_seconds: 120
  max_tokens: 4096

admin:
  host: 127.0.0.1
  port: 3015
