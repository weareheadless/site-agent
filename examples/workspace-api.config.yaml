# One shared Ada API process. Customer state lives in each tenant config/data
# directory; do not create one systemd process per tenant.
instance_name: site-agent-api
data_dir: /SOCIAL/site-agent-api

# Shared, exact build tools inherited by every tenant, including sites created
# later through HelloAda. Replace these paths with the host's pinned installs.
source_deployment:
  node_path: /path/to/pinned-node/bin
  node_version: "22.14.0"
  npm_command: /path/to/pinned-npm/bin/npm
  npm_version: "11.13.0"

workspace_api:
  enabled: true
  host: 127.0.0.1
  port: 3014
  prefix: /v1/workspace
  tenants:
    tenant-example:
      config_path: /srv/site-agent/configs/tenant-example/config.yaml
      api_token_env: PROVISIONED_TENANT_EXAMPLE_TOKEN
