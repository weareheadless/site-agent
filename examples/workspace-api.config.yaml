# One shared Ada API process. Customer state lives in each tenant config/data
# directory; do not create one systemd process per tenant.
instance_name: site-agent-api
data_dir: /SOCIAL/site-agent-api

workspace_api:
  enabled: true
  host: 127.0.0.1
  port: 3014
  prefix: /v1/workspace
  tenants:
    tenant-example:
      config_path: /srv/site-agent/configs/tenant-example/config.yaml
      api_token_env: TENANT_EXAMPLE_TOKEN
