[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "site-agent"
version = "0.1.0"
description = "Portable AI website content manager"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "feedparser>=6.0", "fastapi>=0.110", "uvicorn>=0.29", "pelican>=4.9", "Markdown>=3.4,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "build>=1.2"]
ga = ["google-auth>=2.0", "requests>=2.31"]

[project.scripts]
site-agent = "site_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
site_agent = ["defaults.yaml", "skills/*.md", "web/static/*.html"]
