[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "site-agent"
version = "0.1.0"
description = "Portable AI website content manager"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "feedparser>=6.0", "fastapi>=0.110", "uvicorn>=0.29", "pelican>=4.9", "Markdown>=3.4,<4", "Pillow>=10.4", "pillow-heif>=0.18", "PyMuPDF>=1.24", "python-multipart>=0.0.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "build>=1.2"]
design-lab = ["playwright>=1.50,<2"]
ga = ["google-auth>=2.0", "requests>=2.31"]
crawlseo = ["mcp>=1.28,<2"]

[project.scripts]
site-agent = "site_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
site_agent = ["defaults.yaml", "intake-ada.yaml", "skills/*.md", "web/static/*.html", "web/static/vendor/*.js", "templates/next-payload/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
