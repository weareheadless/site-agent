name: Release build

# Compile one preview candidate in this repository.
#
# The platform mints the signed mount the owner will open, then asks for this
# run with that mount in the payload. Next resolves `basePath` at build time, so
# the mount has to be part of the build; compiling it here is what lets the
# site-agent host serve the candidate instead of compiling a second copy.
#
# This build never touches Cloudflare and never deploys. It produces two
# artifacts — the compiled application and the receipt that proves which commit
# and which mount it was built for — and the host that serves the preview reads
# both.
#
# The production release is `release-deploy.yml` on `main`; it builds its own
# artifact, because production has no preview mount.
on:
  repository_dispatch:
    types: [helloada-candidate]
  workflow_dispatch:

run-name: candidate ${{ github.event.client_payload.sha || github.sha }}

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'

      - name: Pin the release toolchain
        run: |
          npm install --global npm@11.13.0
          echo "NODE_BIN=$(dirname "$(command -v node)")" >> "$GITHUB_ENV"
          echo "NPM_BIN=$(dirname "$(command -v npm)")" >> "$GITHUB_ENV"
          python3 -m pip install --quiet pyyaml

      - name: Check the release contract
        run: |
          CONTROL_SHA=$(python3 -c 'import json;print(json.load(open(".github/helloada-release.json"))["controlSha"])')
          echo "CONTROL_SHA=$CONTROL_SHA" >> "$GITHUB_ENV"
          git clone --quiet --filter=blob:none https://github.com/weareheadless/site-agent.git "$RUNNER_TEMP/control"
          git -C "$RUNNER_TEMP/control" checkout --quiet "$CONTROL_SHA"
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          release = json.loads(Path(".github/helloada-release.json").read_text(encoding="utf-8"))
          payload = json.loads(os.environ.get("CLIENT_PAYLOAD") or "{}")
          base_path = str(payload.get("basePath") or "")
          if base_path and not base_path.startswith("/p/"):
              raise SystemExit("the requested preview mount is not a signed preview path")
          (root / "runtime.env").write_text(
              f"HELLOADA_HANDOFF_PUBLIC_KEY={release['handoffPublicKey']}\n", encoding="utf-8"
          )
          (root / "runtime.env").chmod(0o600)
          (root / "host-credentials.yaml").write_text("credentials: {}\n", encoding="utf-8")
          manifest = {
              "schema": 1,
              "credentialProfile": str(root / "host-credentials.yaml"),
              "nodeBin": os.environ["NODE_BIN"],
              "nodeVersion": release["nodeVersion"],
              "npmBin": os.environ["NPM_BIN"],
              "npmVersion": release["npmVersion"],
              "releaseRoot": str(root / "releases"),
              "connectionGate": {
                  "apiUrl": "https://api.helloada.app/v1",
                  "config": str(root / "absent.yaml"),
                  "envFile": str(root / "runtime.env"),
              },
              "tenantEnvFile": str(root / "runtime.env"),
              "customers": {release["tenant"]: release["customer"]},
          }
          (root / "releases").mkdir(exist_ok=True)
          (root / "manifest.json").write_text(json.dumps(manifest, indent=1), encoding="utf-8")
          (root / "preview-mount").write_text(base_path, encoding="utf-8")
          PY
        env:
          CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}

      - name: Build the preview candidate
        env:
          HELLOADA_PIPELINE_SHA: ${{ env.CONTROL_SHA }}
        run: |
          set -euo pipefail
          SHA="${{ github.event.client_payload.sha || github.sha }}"
          BASE_PATH="$(cat "$RUNNER_TEMP/preview-mount")"
          if [ -z "$BASE_PATH" ]; then
            echo "this run has no signed preview mount; the candidate preview needs one" >&2
            exit 1
          fi
          python3 "$RUNNER_TEMP/control/scripts/deploy-payload-customer.py" \
            --tenant "$(python3 -c 'import json;print(json.load(open(".github/helloada-release.json"))["tenant"])')" \
            --ref "$SHA" \
            --release-id "ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --release-purpose website \
            --manifest "$RUNNER_TEMP/manifest.json" \
            --source-dir "$GITHUB_WORKSPACE" \
            --release-root "$RUNNER_TEMP/releases" \
            --preview-base-path "$BASE_PATH" \
            --preview-only

      - name: Keep the compiled candidate
        uses: actions/upload-artifact@v4
        with:
          name: candidate-open-next
          path: .open-next
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

      - name: Keep the candidate receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-receipt
          path: ${{ runner.temp }}/releases
          if-no-files-found: ignore
          retention-days: 3
