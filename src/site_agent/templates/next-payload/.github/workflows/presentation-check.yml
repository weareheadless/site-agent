name: Presentation check

# Identical in every tenant repository: static presentations verify their
# committed inventory, routes, locales and links before the owner reviews the
# change; Next/Payload tenants are told there is nothing to check.
on:
  push:
    branches: [main, preview]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  presentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the committed presentation
        run: node scripts/check-presentation.mjs
