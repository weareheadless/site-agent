instance_name: default

data_dir: data
poll_seconds: 300

design_engine:
  enabled: false
  intake_schema_version: 1
  manifest_path: design/ada-design-manifest.json
  provider: openrouter
  model: ""
  base_url: ""
  api_key_env: ""
  orchestration: legacy
  specialist_timeout_seconds: 600
  repair_attempts: 0
  max_tokens: 8192
  required_viewports:
    - {name: desktop, width: 1440, height: 1000}
    - {name: tablet, width: 768, height: 1024}
    - {name: mobile, width: 390, height: 844}
  libraries:
    gsap:
      enabled: true
  fonts: []        # optional exact local WOFF2 provisions: source_path, destination, sha256
  quality:
    browser: false
    accessibility: true
    visual_critic: false
    native_source_required: false
    originality_required: false
    internal_scaffold_fingerprints: []
    required_font_families: []
    approved_font_files: []
    allowed_hard_denied_paths: []

persona:
  name: Ada
  spirit: ""     # who she is in this site's world — embodied, first person
  voice: ""
  audience: ""
  directions: [] # extra basic directions this site adds to her core ones
  taboo: []
  lures: []       # legacy location; prefer dream.lures

# Optional bootstrap facts for a tenant that has not completed Intake Ada.
# Keep this bounded and mark public-site observations as needing owner review;
# the editor prompt will refuse to invent missing business facts.
customer_profile: {}

atelier_intake:
  enabled: false
  database_only: true
  research:
    enabled: true
    max_sources_per_pass: 8
    max_items_per_source: 15
    max_passes_before_owner_turn: 1
    planner:
      max_tokens: 1200
      enable_thinking: false
    synthesizer:
      max_tokens: 300

atelier_scheduler:
  enabled: false
  poll_seconds: 300
  schedule:
    digest: {every: weekly, weekday: monday, at: "08:00"}
    learn: {every: weekly, weekday: monday, at: "08:20"}
    article: {every: weekly, weekday: tuesday, at: "09:00"}

atelier_editorial:
  enabled: false

schedule:
  digest: {every: daily, at: "09:00"}
  learn: {every: daily, at: "10:00"}
  weekly_report: {every: weekly, weekday: monday, at: "08:00"}
  article: {every: weekly, weekday: tuesday, at: "09:00"}
  reflect: {every: monthly}
  inner_voice: {every: 2, at: "14:00"}
  dream: {every: 7, weekday: sunday, at: "05:00"}
  integrate_self: {every: 2, at: "20:00"}
  compact: {every: 7, weekday: sunday, at: "04:00"}
  health_check: {every: daily, at: "12:00"}
  seo_snapshot: {every: daily, at: "11:30"}
  seo_research_cycle: {every: daily, at: "13:00"}
  seo_outcomes: {every: daily, at: "14:00"}
  seo_site_report_cycle: {every: daily, at: "13:00"}
  article_research_cycle: {every: daily, at: "13:30"}
  strategist: {every: 7, weekday: sunday, at: "18:00"}
  backup: {every: 7, weekday: sunday, at: "03:00"}
  social_post: {every: weekly, weekday: thursday, at: "09:00"}

social:
  enabled: false
  max_pending: 2
  default_format: single
  languages: [en]

maintenance:
  observation_retention_days: 45
  compact_min_batch: 20

sources:
  subreddits: []
  rss_feeds: []
  keywords: []
  min_score: 0.0
  max_per_run: 25

ga:
  enabled: false
  source: ga4
  property_id: ""
  key_path: ""

seo:
  enabled: false
  source: gsc
  site_url: ""
  key_path: ""
  research:
    enabled: false
    timezone: UTC
    languages:
      - code: en
        markets: [US]
        primary: true
    existing_locales: [en]
    competitors: []
    business_goals: []
    priority_services: []
    anchor_topics: []
  site_report:
    enabled: false
    timezone: UTC
    max_crawl_pages: 200
  article_research:
    enabled: false
    timezone: UTC
    language: en
    market: US

site:
  adapter: github_static
  repository: ""
  branch: main
  content_path: content.json
  preview_url: ""   # shown in the admin Design tab
  preview_branch: ""   # e.g. "preview": proposals render here before approval (Cloudflare Pages)
  clone_path: ""     # local git clone for the builder agent (optional)
  writable_patterns: ["*.css", "*.md", "articles/*", "content/articles/*"]   # fnmatch patterns Ada may write/edit/delete
  readonly_note: "admin.html, secrets and CI files are always denied"
  brand:
    font_body: ""       # optional: admin UI body font stack (e.g. "'Manrope', sans-serif")
    font_display: ""    # optional: admin UI display/heading font stack
    fonts_url: ""       # optional: Google Fonts URL to load for the brand fonts
    logo: ""            # optional: logo image URL shown in the admin header
  media:                # optional Cloudflare R2 for the admin image uploader
    enabled: false       # one private, customer-scoped bucket
    account_id: ""      # Cloudflare account ID
    bucket: ""          # R2 bucket name
    private: true        # public buckets are not supported by the media workflow
    public_url: ""      # legacy compatibility only; private media does not need this
    signed_url_ttl_seconds: 900
    max_image_bytes: 26214400
    max_pdf_bytes: 52428800
    max_image_pixels: 80000000
    max_pdf_pages: 30
    vision_pages_per_call: 12
    pdf_render_dpi: 220
    image_max_edge: 3200
    webp_quality: 84
    vision_image_max_edge: 1600
    vision_image_quality: 70
    max_chat_attachments: 12
    site_asset_dir: ""
    # access key id + secret resolved via env mapping below
  payload:              # optional Payload draft gateway
    enabled: false
    url: ""
    api_prefix: /api
    token_env: PAYLOAD_GATEWAY_TOKEN
    timeout_seconds: 30
    # Required when enabled. Values are instance-specific and belong in the
    # tenant config, not in the Payload adapter implementation.
    contract:
      collections: {}
      globals: {}
      media_fields: []
  cloudflare:
    account_id: ""
    project_name: ""
    mode: git

providers:
  cicero:
    enabled: false
    base_url: http://127.0.0.1:8000
    token_env: CICERO_SERVICE_TOKEN
    poll_interval_seconds: 2
    preparation_timeout_seconds: 600
  crawlseo:
    enabled: false
    url: ""
    token_env: CRAWLSEO_SERVICE_TOKEN
    timeout_seconds: 30
    max_response_bytes: 2097152

blog:
  # New instances use Pelican. Existing instances should pin legacy explicitly
  # until their repository has a Pelican config and theme.
  engine: pelican
  articles_dir: content/articles
  site_url: ""
  build_command: "pelican content -o output -s pelicanconf.py"
  journal_enabled: false

llm:
  base_url: https://openrouter.ai/api/v1
  model: deepseek/deepseek-v4-flash-0731
  timeout_seconds: 300
  max_tokens: 16384      # generous output budget for creative work
  tool_calling: true   # native function-calling loop for the admin chat
  max_work_steps: 24  # tool/continuation rounds before asking the owner to continue
  max_retries: 2
  daily_budget_usd: 2.0
  price_per_mtok:
    input: 0.15
    output: 0.60

self_model:
  enabled: true

dream:
  enabled: true
  residue_count: 0   # external reading is opt-in for private dreams
  lures: []   # optional associative interference; empty means no lure

vision:
  enabled: false
  base_url: ""          # OpenAI-compatible /v1 endpoint
  model: ""
  timeout_seconds: 90
  max_tokens: 4096

admin:
  host: 127.0.0.1
  port: 3011
  theme: {}   # optional admin UI brand overrides: bg, card, line, text, dim, accent,
              # ok, warn, bad, radius, font_body, font_display, fonts_url, logo

publish_mode: ask_first

atelier_api:
  enabled: false
  host: 127.0.0.1
  port: 3014
  prefix: /v1/atelier
  tenants: {}

env:
  llm_api_key: SITE_AGENT_LLM_API_KEY
  vision_api_key: SITE_AGENT_VISION_API_KEY
  github_token: GITHUB_TOKEN
  admin_password: SITE_AGENT_ADMIN_PASSWORD
  cloudflare_api_token: CLOUDFLARE_API_TOKEN
  r2_access_key_id: R2_ACCESS_KEY_ID
  r2_secret_access_key: R2_SECRET_ACCESS_KEY
  cicero_service_token: CICERO_SERVICE_TOKEN
  crawlseo_service_token: CRAWLSEO_SERVICE_TOKEN
  payload_gateway_token: PAYLOAD_GATEWAY_TOKEN

builder:
  enabled: false
  model: openrouter/deepseek/deepseek-v4.1-flash
  timeout_seconds: 1800
  provider_timeout_seconds: 2100
  provider_chunk_timeout_seconds: 180
  output_tokens: 8192
  reasoning_effort: low
  validation_repair_attempts: 2
