instance_name: intake-ada
role: intake
data_dir: /var/lib/helloada/intake-ada
poll_seconds: 0

persona:
  name: Ada
  mode: intake_creative_director

incubation:
  root: /var/lib/helloada/incubations
  abandoned_ttl_days: 30
  rejected_ttl_hours: 24
  scaffold: /var/lib/helloada/neutral-scaffold

preview:
  # Intake Lab review links remain usable while an owner inspects a candidate.
  # The capability is still scoped to one run and kept in process memory.
  ttl_seconds: 14400

provisioning:
  customer_root: /var/lib/helloada/customers

research:
  enabled: true
  max_sources_per_pass: 8
  max_items_per_source: 15
  # One automatic research pass per intake revision (never more): the owner's
  # next message advances the revision and unlocks one fresh pass, so research
  # keeps pace with the conversation without ever bursting. When a pass reads
  # no public source, it falls back to one bounded pipeworx query so the pass
  # still yields evidence for the advisor.
  max_passes_before_owner_turn: 1

infusion:
  enabled: true
  # opencode | native | auto (opencode first, native fallback)
  mode: auto
  idle_seconds: 90
  cooldown_seconds: 60
  max_tokens_per_pass: 1200
  max_passes_per_day: 120
  opencode_pass_interval_seconds: 1800
  include_pipeworx: true

schedule: {}
sources:
  subreddits: []
  rss_feeds: []
  keywords: []
  min_score: 0.0
  max_per_run: 25

site:
  adapter: neutral_scaffold
  repository: ""
  clone_path: ""
  preview_url: ""
  preview_branch: ""
  writable_patterns: ["*.html", "*.css", "*.js", "content/**", "themes/**", "images/**", "output/**", "*.xml", "pelicanconf.py", "build.sh"]
  cloudflare:
    account_id: ""
    project_name: ""
    mode: none
  media:
    enabled: false
    # The owner's supplied reference images are materialized into the isolated
    # build clone (never served by URL); the visual builder chooses the strongest
    # files for the homepage under a safe relative path allowed by
    # site.writable_patterns ("images/**").
    site_asset_dir: images/ada-media

ga:
  enabled: false
  property_id: ""
  key_path: ""

seo:
  enabled: false
  site_url: ""
  key_path: ""

providers:
  cicero:
    enabled: false
  crawlseo:
    enabled: false

llm:
  base_url: https://openrouter.ai/api/v1
  model: deepseek/deepseek-v4.1-flash
  timeout_seconds: 300
  max_tokens: 16384
  tool_calling: false
  max_work_steps: 24
  max_retries: 2
  daily_budget_usd: 2.0
  # OpenRouter is asked for its authoritative usage receipt. These rates are a
  # fallback for compatible responses that return tokens but omit usage.cost.
  include_usage: true
  price_per_mtok:
    input: 0.15
    output: 0.60

design_engine:
  enabled: true
  build_profile: next_react
  intake_schema_version: 1
  provider: openrouter
  # One Ada Build turn designs and realizes the whole site from the confirmed
  # intake context and installed skills, including purposeful motion and its
  # reduced-motion branch. Validation observes the rendered owner surface; no
  # post-hoc motion specialist or specialist committee is used.
  orchestration: creative
  # The experience-fidelity phase closes every locked journey condition in the
  # worktree, so it needs a real budget. High reasoning on the strict planning
  # contract is slow; the bounded fidelity correction is evidence-driven and
  # stays low so the final owner-surface render still fits its budget.
  specialist_timeout_seconds: 1800
  specialist_reasoning_effort: low
  reasoning_by_phase:
    creative_selection: high
    transfer_review: high
    experience_fidelity: low
  model: deepseek/deepseek-v4.1-flash
  planner_model: deepseek/deepseek-v4.1-flash
  vision_planner_model: deepseek/deepseek-v4.1-flash
  api_key_env: OPENROUTER_API_KEY
  intake_advisor:
    # The intake conversation is a strict JSON-extraction loop, so it gets its
    # own provider/model rather than the reasoning engine's. The media worker
    # reads and tags reference images once; the advisor consumes stored visual
    # summaries and never receives raw image URLs.
    provider: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    model: deepseek/deepseek-v4.1-flash
    timeout_seconds: 90
    max_retries: 1
    max_tokens: 4096
    enable_thinking: false
  repair_attempts: 1
  max_tokens: 8192
  required_viewports:
    - {name: desktop, width: 1440, height: 1000}
    - {name: tablet, width: 768, height: 1024}
    - {name: mobile, width: 390, height: 844}
  libraries:
    # Approved frontend capabilities for the controlled baseline. `required`
    # makes the host enforce the capability instead of leaving it to model
    # preference; the runtime remains pinned and host-provisioned.
    gsap:
      enabled: true
      required: true
  quality:
    browser: true
    accessibility: true
    visual_critic: true
    native_source_required: true
    react_source_required: true
    gsap_required: true
    allowed_hard_denied_paths: []

builder:
  enabled: true
  model: openrouter/deepseek/deepseek-v4.1-flash
  # First pass is intentionally time-boxed: produce a complete, working page
  # and let the owner steer refinement, rather than spending 30 minutes before
  # the owner ever sees a candidate.
  timeout_seconds: 900
  provider_timeout_seconds: 2100
  provider_chunk_timeout_seconds: 180
  # Keep the request within the configured provider credit ceiling. The model
  # can still use its full integrated build turn; requesting more than the
  # account can afford fails before Ada gets a chance to act.
  # The creative direction response is a typed plan, not just prose. DeepSeek
  # may spend a large share of the turn on reasoning, so leave enough output
  # headroom for the complete JSON object and its closing delimiters.
  output_tokens: 32768
  # Keep the native direction and integrated realization inside the available
  # provider credit ceiling; the typed host gates remain authoritative.
  reasoning_effort: low
  validation_repair_attempts: 1

vision:
  enabled: true
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  model: deepseek/deepseek-v4.1-flash
  timeout_seconds: 45
  max_tokens: 1200
  include_usage: true
  price_per_mtok:
    input: 0.15
    output: 0.60

publish_mode: disabled

env:
  llm_api_key: OPENROUTER_API_KEY
  vision_api_key: OPENROUTER_API_KEY
  design_api_key: OPENROUTER_API_KEY
  visual_review_api_key: OPENROUTER_API_KEY
