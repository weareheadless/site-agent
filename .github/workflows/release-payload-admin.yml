name: Release shared HelloAda Payload admin

on:
  push:
    tags:
      - 'payload-admin-v*'

permissions:
  contents: write

concurrency:
  group: payload-admin-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        working-directory: packages/helloada-payload-admin
        run: npm ci --ignore-scripts
      - name: Test and typecheck the shared workspace
        working-directory: packages/helloada-payload-admin
        run: |
          npm test
          npm run typecheck
      - name: Package and inspect the tagged artifact
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/package-payload-admin-release.mjs
      - name: Publish immutable release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" packages/helloada-payload-admin/.release/*.tgz packages/helloada-payload-admin/.release/release-manifest.json --verify-tag --title "HelloAda Payload admin ${RELEASE_TAG#payload-admin-v}" --notes "Tested shared owner workspace with inspected artifact and integrity manifest. Customer deployment and authenticated browser verification remain separate release stages."
