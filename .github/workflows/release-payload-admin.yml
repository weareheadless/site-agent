name: Release shared HelloAda Payload admin

on:
  push:
    tags:
      - 'payload-admin-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable Payload admin tag to package and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: payload-admin-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Pin the release packer
        run: npm install --global npm@11.13.0
      - run: test "$(npm --version)" = "11.13.0"
      - name: Install pinned dependencies
        working-directory: packages/helloada-payload-admin
        run: npm ci --ignore-scripts
      - name: Test and typecheck the shared workspace
        working-directory: packages/helloada-payload-admin
        run: |
          npm test
          npm run typecheck
      - name: Package and inspect the tagged artifact
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: node scripts/package-payload-admin-release.mjs
      - name: Publish immutable release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" packages/helloada-payload-admin/.release/*.tgz packages/helloada-payload-admin/.release/release-manifest.json --clobber
          else
            gh release create "$RELEASE_TAG" packages/helloada-payload-admin/.release/*.tgz packages/helloada-payload-admin/.release/release-manifest.json --verify-tag --title "HelloAda Payload admin ${RELEASE_TAG#payload-admin-v}" --notes "Tested shared owner workspace with inspected artifact and integrity manifest. Customer deployment and authenticated browser verification remain separate release stages."
          fi
