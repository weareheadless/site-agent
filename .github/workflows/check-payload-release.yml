name: Validate Payload release queue

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'AGENTS.md'
      - 'docs/helloada-project-selector-to-payload-intake-contract.md'
      - 'packages/**'
      - 'src/site_agent/**'
      - 'tests/**'
      - 'scripts/**'
      - 'deploy/**'
      - 'src/site_agent/templates/next-payload/**'
      - 'pyproject.toml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'AGENTS.md'
      - 'docs/helloada-project-selector-to-payload-intake-contract.md'
      - 'packages/**'
      - 'src/site_agent/**'
      - 'tests/**'
      - 'scripts/**'
      - 'deploy/**'
      - 'src/site_agent/templates/next-payload/**'
      - 'pyproject.toml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - name: Verify locked shared package release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m site_agent.application.release_dependencies --package @weareheadless/helloada-payload-core --package @weareheadless/helloada-payload-admin

  next-payload-template:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Test Resend and Mailflare Worker contracts
        working-directory: src/site_agent/templates/next-payload
        run: node --experimental-strip-types --test tests/resend-mail.test.mjs tests/mailflare-runtime.test.mjs tests/mailflare-inbox.test.mjs tests/mailflare-owner-gate.test.mjs

  mailflare-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Pin the production npm toolchain
        run: npm install --global npm@11.13.0
      - run: test "$(npm --version)" = "11.13.0"
      - name: Test pinned Mailflare integration patches
        working-directory: packages/helloada-mailflare
        run: npm test
      - name: Build and verify the exact tenant Mailflare assets
        run: |
          set -euo pipefail
          tenant_root="$(mktemp -d)"
          trap 'rm -rf -- "$tenant_root"' EXIT
          mkdir -p "$tenant_root/public"
          cp src/site_agent/templates/next-payload/template-manifest.json "$tenant_root/public/helloada-release.json"
          npm run build --prefix packages/helloada-mailflare -- --tenant-root "$tenant_root"
          test -s "$tenant_root/.mailflare/server/index.js"
          test -s "$tenant_root/.mailflare/server/ssr/index.js"
          test -d "$tenant_root/.mailflare/client/_next/static"
          test -f "$tenant_root/.mailflare/migrations/0061_helloada_booking_idempotency.sql"
          test -f "$tenant_root/.mailflare/migrations/0062_helloada_payload_migration.sql"
          node -e 'const p=require(process.argv[1]); if(p.commit!=="ca41c56a0781bf848b9898ddcc5615b3eacfbf8e") process.exit(1)' "$tenant_root/.mailflare/provenance.json"

  shared-payload-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [helloada-payload-core, helloada-payload-admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: packages/${{ matrix.package }}/package-lock.json
      - name: Pin the production npm toolchain
        run: npm install --global npm@11.13.0
      - run: test "$(npm --version)" = "11.13.0"
      - name: Install locked package dependencies
        working-directory: packages/${{ matrix.package }}
        run: npm ci --ignore-scripts
      - name: Test and typecheck shared package
        working-directory: packages/${{ matrix.package }}
        run: |
          npm test
          npm run typecheck
      - name: Rebuild and inspect the locked Payload admin candidate
        if: matrix.package == 'helloada-payload-admin'
        run: node scripts/package-payload-admin-release.mjs --candidate
