name: Validate Payload release queue

on:
  pull_request:
    paths:
      - 'deploy/**'
      - 'pyproject.toml'
      - 'scripts/*payload*'
      - 'scripts/migrate-static-tenants-to-registry.py'
      - 'scripts/deploy-site-agent-api.py'
      - 'src/site_agent/application/workspace.py'
      - 'src/site_agent/application/tenant_registration.py'
      - 'src/site_agent/web/server.py'
      - 'tests/test_payload_release.py'
      - 'tests/test_tenant_registry_migration.py'
      - 'tests/test_tenant_registration.py'
      - 'tests/test_web.py'
      - 'tests/test_workspace_web.py'
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - 'pyproject.toml'
      - 'scripts/*payload*'
      - 'scripts/migrate-static-tenants-to-registry.py'
      - 'scripts/deploy-site-agent-api.py'
      - 'src/site_agent/application/workspace.py'
      - 'src/site_agent/application/tenant_registration.py'
      - 'src/site_agent/web/server.py'
      - 'tests/test_payload_release.py'
      - 'tests/test_tenant_registry_migration.py'
      - 'tests/test_tenant_registration.py'
      - 'tests/test_web.py'
      - 'tests/test_workspace_web.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: >-
          python -m pytest -q
          tests/test_payload_release.py
          tests/test_tenant_registry_migration.py
          tests/test_tenant_registration.py
          tests/test_workspace_web.py
